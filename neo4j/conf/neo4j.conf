# KG-COST Neo4j 5.x configuration overrides.
#
# This file is mounted into the container at `/conf/neo4j.conf` (see
# `neo4j/docker-compose.yml`) and overrides the image defaults. Keys follow
# the Neo4j 5.x namespace conventions (`server.*`, `dbms.*`, `apoc.*`).
#
# Tuning targets for KG-COST bulk import + interactive query:
#   - 4 GB max heap, 2 GB pagecache (graph ~5-10 GB on disk per CLAUDE.md).
#   - Import dir pinned to the docker-mounted /var/lib/neo4j/import volume,
#     which surfaces the project's data/neo4j_import/ tree.
#   - APOC enabled for post-import sanity-count helpers and CSV import procs.

# ---- Memory ----
server.memory.heap.initial_size=2G
server.memory.heap.max_size=4G
server.memory.pagecache.size=2G

# ---- Import directory ----
server.directories.import=/var/lib/neo4j/import

# ---- APOC ----
apoc.import.file.enabled=true
dbms.security.procedures.unrestricted=apoc.*
dbms.security.procedures.allowlist=apoc.*
